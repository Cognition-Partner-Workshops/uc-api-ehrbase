# Layer on docker-compose.yml from the repository root.
services:
  ehrbase:
    image: ehrbase/em51-billing-qa:local
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/billing-qa.yml
      BILLING_PROFILE_ENABLED: ${BILLING_PROFILE_ENABLED:-true}
      SECURITY_AUTHTYPE: BASIC
    volumes:
      - ./tests/billing-qa/application.yml:/app/config/billing-qa.yml:ro
    depends_on:
      mock-fhir:
        condition: service_started
    ports: !override
      - "127.0.0.1:8080:8080"
  ehrdb:
    ports: !override []
  keycloak:
    ports: !override
      - "127.0.0.1:8081:8080"
  mock-fhir:
    image: python:3.12-alpine
    command: ["python", "-u", "/qa/mock_fhir.py"]
    volumes:
      - ./tests/billing-qa/mock_fhir.py:/qa/mock_fhir.py:ro
    networks:
      - ehrbase-net
